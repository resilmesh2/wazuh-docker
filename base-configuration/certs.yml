nodes:
  # Wazuh indexer server nodes
  indexer:
    - name: resilmesh_tap_wazuh_indexer
      ip: resilmesh_tap_wazuh_indexer

  # Wazuh server nodes
  # Use node_type only with more than one Wazuh manager
  server:
    - name: resilmesh_tap_wazuh_manager
      ip: resilmesh_tap_wazuh_manager

  # Wazuh dashboard node
  dashboard:
    - name: resilmesh_tap_wazuh_dashboard
      ip: resilmesh_tap_wazuh_dashboard
